<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=device-width, initial-scale=1.0">
    <title>Signature Tool</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #e3fdfd, #ffe6fa);" 
      class="d-flex justify-content-center align-items-center min-vh-100">


    <div class="container">
    <div class="card shadow-lg border-0" style="max-width: 500px; margin: auto; border-radius: 20px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4" style="font-weight: 600;">Signature Creator</h3>

            <div class="p-3 bg-white rounded shadow-sm">
                <canvas id="signatureCanvas" width="450" height="200" class="w-100" style="touch-action: none; border-radius: 10px;"></canvas>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-center">
                <button class="btn btn-primary" id="clearBtn">🧹 Clear</button>
                <button class="btn btn-primary" id="savePngBtn">🖼 PNG</button>
                <button class="btn btn-primary" id="saveJpgBtn">🖊 JPG</button>
                <button class="btn btn-primary" id="savePdfBtn">📄 PDF</button>
                <button class="btn btn-primary" id="undoBtn">Undo</button>
            </div>

        </div>
    </div>
</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
